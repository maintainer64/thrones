name: Go and React

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web format:check
      - run: pnpm --dir web test
      - run: node --test scripts/lib/*.test.mjs
      - run: pnpm --dir web build
      - run: node scripts/sync-web.mjs
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race -count=1 -timeout=20m ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/westeros ./cmd/server
      - name: Save the exact frontend and artwork used by browser jobs
        uses: actions/upload-artifact@v7
        with:
          name: browser-build
          if-no-files-found: error
          path: |
            web/dist/
            web/src/artwork/index.json
            local-assets/**/*.webp
            local-assets/*.webp
          retention-days: 3

  browser:
    name: Browser / ${{ matrix.suite }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite:
          [
            Artwork,
            Combat,
            CombatMatrix,
            Events,
            Influence,
            Orders,
            Panels,
            Provision,
            Raven,
            SetupBlade,
            Tides,
          ]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: pnpm --dir web install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: .
      - run: node scripts/sync-web.mjs
      - name: Install browser for real decision UI tests
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Decision UI against real Go HTTP, WebSocket and SQLite
        run: go test -count=1 -run "^Test${BROWSER_SUITE}Browser$" -timeout=20m -v ./internal/server
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
          WESTEROS_BROWSER_TEST: "1"
          PLAYWRIGHT_MANAGED_CHROMIUM: "1"
          SOFTWARE_WEBGL: "1"
      - name: Preserve failed browser diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ matrix.suite }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
