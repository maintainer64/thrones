services:
  app:
    build: .
    image: westeros-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-18081}:18081"
    environment:
      LISTEN_ADDR: 0.0.0.0:18081
      DATA_DIR: /data
      COOKIE_SECURE: "false"
      LOCAL_ASSETS_DIR: /local-assets
    volumes:
      - game-data:/data
      - ./local-assets:/local-assets:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1

volumes:
  game-data:
